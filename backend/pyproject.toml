[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40.72",
    "fastapi[standard]==0.125.0",
    "pydantic[email]==2.12.5",
    "pydantic-settings==2.12.0",
    "sqlmodel==0.0.27",
    "alembic>=1.17.2",
    "pyjwt[crypto]>=2.10.1",
    "pwdlib[argon2]>=0.3.0",
    "asyncpg>=0.31.0",
    "grpcio>=1.76.0",
    "fastapi-csrf-protect>=1.0.7",
    "httpx>=0.28.1",
    "cryptography>=46.0.5",
    "phonenumbers>=9.0.24",
    "typst>=0.14.8",
    "protobuf>=6.33.2",
]

[tool.ruff]
line-length = 88
extend-exclude = [
    "migrations",
    "scripts",
    "app/generated",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E402", "E712", "F403"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["."]
exclude = [
    '**/migrations',
    '**/scripts',
    '**/generated',
    '**/__pycache__',
    '**/node_modules',
    '**/.*',
    '.venv',
    '**/.venv',
]
ignore = ["tests"]

[dependency-groups]
codegen = [
    "grpcio-tools>=1.76.0",
]

dev = [
    "aiosqlite>=0.22.0",
    "greenlet>=3.3.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
