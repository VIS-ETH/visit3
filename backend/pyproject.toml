[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.125.0",
    "uvicorn[standard]",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "sqlmodel==0.0.27",
    "alembic>=1.17.2",
    "pyjwt[crypto]>=2.10.1",
    "pwdlib[argon2]>=0.3.0",
    "asyncpg>=0.31.0",
    "grpcio>=1.76.0",
    "grpcio-tools>=1.76.0",
    "fastapi-csrf-protect>=1.0.7",
    "httpx>=0.28.1",
    "cryptography>=46.0.5",
    "phonenumbers>=9.0.24",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E402", "E712", "F403"]

[dependency-groups]
dev = [
    "ruff>=0.15.11",
]
