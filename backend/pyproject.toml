[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.99",
    "fastapi[standard]==0.141.1",
    "pydantic[email]==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlmodel==0.0.45",
    "alembic>=1.20.0",
    "pyjwt[crypto]>=2.14.0",
    "pwdlib[argon2]>=0.3.1",
    "asyncpg>=0.31.0",
    "grpcio>=1.84.0",
    "fastapi-csrf-protect>=1.0.7",
    "httpx>=0.28.1",
    "cryptography>=50.0.1",
    "phonenumbers>=9.0.39",
    "typst>=0.15.0",
    "protobuf>=7.36.2",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
]

[tool.ruff]
line-length = 88
extend-exclude = [
    "migrations",
    "scripts",
    "app/generated",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E402", "E712", "F403"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["."]
exclude = [
    '**/migrations',
    '**/scripts',
    '**/generated',
    '**/__pycache__',
    '**/node_modules',
    '**/.*',
    '.venv',
    '**/.venv',
]
ignore = ["tests"]

[dependency-groups]
codegen = [
    "grpcio-tools>=1.84.0",
]

dev = [
    "aiosqlite>=0.22.1",
    "boto3-stubs[s3]>=1.43.99",
    "greenlet>=3.5.6",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
