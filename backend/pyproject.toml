[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.24",
    "fastapi[standard]==0.136.3",
    "pydantic[email]==2.13.4",
    "pydantic-settings==2.14.1",
    "sqlmodel==0.0.38",
    "alembic>=1.18.4",
    "pyjwt[crypto]>=2.13.0",
    "pwdlib[argon2]>=0.3.0",
    "asyncpg>=0.31.0",
    "grpcio>=1.81.0",
    "fastapi-csrf-protect>=1.0.7",
    "httpx>=0.28.1",
    "cryptography>=48.0.0",
    "phonenumbers>=9.0.32",
    "typst>=0.14.9",
    "protobuf>=6.33.2",
    "pypdf>=6.3.0",
]

[tool.ruff]
line-length = 88
extend-exclude = [
    "migrations",
    "scripts",
    "app/generated",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E402", "E712", "F403"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["."]
exclude = [
    '**/migrations',
    '**/scripts',
    '**/generated',
    '**/__pycache__',
    '**/node_modules',
    '**/.*',
    '.venv',
    '**/.venv',
]
ignore = ["tests"]

[dependency-groups]
codegen = [
    "grpcio-tools>=1.81.0",
]

dev = [
    "aiosqlite>=0.22.0",
    "greenlet>=3.5.1",
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
