[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.11.7"

[[repos.hooks]]
id = "ruff-format"
files = "^backend/"

[[repos]]
repo = "https://github.com/pre-commit/mirrors-prettier"
rev = "v4.0.0-alpha.8"

[[repos.hooks]]
id = "prettier"
files = '^frontend/src/.*\.(ts|tsx|json|css)$'
exclude = "^frontend/src/orval/"
