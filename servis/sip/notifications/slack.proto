syntax = "proto3";

package sip.notifications;

option go_package = "servis/sip/notifications";

// SlackMessagingService exposes RPCs to send notifications to Slack
//
// Authorization _must_ be included in the RPC headers.
// The header "X-Slack-Token" must be a valid bot token (starting with `xoxb-...`)
// The token _must_ be allowed to list users in the Slack workspace and start DMs.
//
// This authentication procedure allows one API (hosted by VIS/VSETH) to send messages to many workspaces.
// However, it also allows each application to very easily be configured via the Slack admin page: profile image, name & other details.
service SlackMessagingService {
  // SendSlackMessage send a message via Slack using Slack Block system.
  // This is an immediate action, and it might be subject to rate limits.
  // You should also expect it to be quite slow - this starts quite a bit of Slack API interactions.
  rpc SendSlackMessage(SlackRequest) returns (SlackResponse);
}

message SlackRequest {
  // Username of the slack user that is receiving the message
  // In our case this corresponds to the ETH username, or other usernames generated by VSETH Login
  string recipient = 1;
  // JSON-encoded array of Slack blocks https://app.slack.com/block-kit-builder/
  string blocks_json = 2;
  // Fallback plain-text message
  string fallback_text = 3;
}

message SlackResponse {}
