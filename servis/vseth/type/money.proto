syntax = "proto3";

package vseth.type;

option go_package = "servis/vseth/type/money";
option java_package = "ch.vseth.type.money";
option java_multiple_files = true;

// Money represents an amount of money with its currency type.
// This is used instead of the google.type.money as we do not need sub-cent
// granularity and thus can reduce some complexity by only concidering cents.
message Money {
    // The 3-letter currency code defined in ISO 4217.
    string currency_code = 1;

    // The amount of cents.
    // For example if `currencyCode` is "CHF", then 100 cents is 1 CHF.
    int64 cents = 2;
}
